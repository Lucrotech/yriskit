name = "yriskit"
main = ".open-next/worker.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "yriskit"

[[d1_databases]]
binding = "DB"
database_name = "yriskit"
database_id = "3f720f7e-609a-402c-90e9-9f49e9b88215"

# Uncomment after enabling R2 and creating the bucket in Cloudflare Dashboard.
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "yriskit-documents"

[images]
binding = "IMAGES"

[vars]
NEXT_PUBLIC_APP_URL = "https://yriskit.co.za"
NEXT_PUBLIC_SITE_URL = "https://yriskit.co.za"

[triggers]
crons = ["0 6 * * *"]
